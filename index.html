<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奶龙大笑模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fffdf5;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      user-select: none;
      overflow: hidden;
    }

    h1 {
      font-size: 28px;
      color: #f5a623;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .tip {
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }

    #nailong {
      width: 260px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #nailong:hover { transform: scale(1.05); }
    #nailong:active { transform: scale(0.95); }

    #btn {
      margin-top: 28px;
      padding: 12px 42px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #f5a623;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d18a0f;
      transition: transform 0.1s;
    }

    #btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d18a0f;
    }

    #btn.playing {
      background: #ccc;
      box-shadow: 0 4px 0 #999;
    }
  </style>
</head>
<body>
  <h1>🍋 奶龙大笑模拟器 🍋</h1>
  <p class="tip">点击奶龙，播放魔性大笑（再点一下可停止）</p>

  <img id="nailong" src="assets/nailong.png" alt="奶龙" />

  <button id="btn">开笑！</button>

  <audio id="laugh" src="assets/laugh.mp3" preload="auto"></audio>

  <script>
    const dragon = document.getElementById("nailong");
    const btn = document.getElementById("btn");
    const laugh = document.getElementById("laugh");

    let playing = false;

    function toggle() {
      playing = !playing;
      btn.classList.toggle("playing", playing);
      btn.textContent = playing ? "别笑了！" : "开笑！";

      if (playing) {
        // 从随机位置开始播，每次听感不完全一样
        laugh.currentTime = Math.random() * 8;
        laugh.play().catch(() => {});
      } else {
        laugh.pause();
      }
    }

    dragon.addEventListener("click", toggle);
    btn.addEventListener("click", toggle);
    laugh.addEventListener("ended", () => {
      if (playing) {
        laugh.currentTime = Math.random() * 8;
        laugh.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
