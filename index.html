<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奶龙大笑模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      padding: 16px 0;
      background: #fffdf5;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      user-select: none;
      overflow-x: hidden;
      overflow-y: auto;
    }

    h1 {
      font-size: 28px;
      color: #f5a623;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .tip {
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* 四角装饰动图 */
    .corner-gif {
      position: fixed;
      width: clamp(64px, 9vw, 112px);
      height: auto;
      pointer-events: none;
      z-index: 1;
    }

    .corner-gif.top-left {
      top: clamp(8px, 2.5vw, 32px);
      left: clamp(8px, 2.5vw, 32px);
    }

    .corner-gif.top-right {
      top: clamp(8px, 2.5vw, 32px);
      right: clamp(8px, 2.5vw, 32px);
    }

    .corner-gif.bottom-left {
      bottom: clamp(8px, 2.5vw, 32px);
      left: clamp(8px, 2.5vw, 32px);
    }

    .corner-gif.bottom-right {
      right: clamp(8px, 2.5vw, 32px);
      bottom: clamp(8px, 2.5vw, 32px);
    }

    /* 奶龙本体：点击它就开笑 */
    #nailong {
      width: 260px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #nailong:hover { transform: scale(1.05); }
    #nailong:active { transform: scale(0.95); }

    /* 大笑状态：上下抖动 */
    #nailong.laughing {
      animation: shake-y 0.18s linear infinite;
    }

    @keyframes shake-y {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-22px); }
      100% { transform: translateY(0); }
    }

    #btn {
      margin-top: 28px;
      padding: 12px 42px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #f5a623;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d18a0f;
      transition: transform 0.1s;
    }

    #btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d18a0f;
    }

    #btn.playing {
      background: #ccc;
      box-shadow: 0 4px 0 #999;
    }

    /* 大笑时飘出来的“哈哈哈哈” */
    .haha {
      position: fixed;
      font-size: 22px;
      font-weight: bold;
      color: #f5a623;
      pointer-events: none;
      animation: float-up 1.2s ease-out forwards;
    }

    @keyframes float-up {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-140px) rotate(18deg); }
    }

    /* 底部署名 */
    .byline {
      margin-top: 20px;
      font-family: "SimSun", "宋体", "STSong", serif;
      font-size: 12px;
      color: #b3a892;
      letter-spacing: 0.5px;
    }

    /* 底部访问量统计 */
    .view-count {
      margin-top: 4px;
      color: #c0a06a;
      font-size: 13px;
    }

    .view-count b {
      color: #f5a623;
      font-size: 15px;
    }

    /* 计数器下方那行红字：要和标题一个量级，一眼就能看见 */
    .ending-tip {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "SimHei", "黑体", "SimSun", "宋体", serif;
      font-weight: bold;
      font-size: clamp(20px, 4.2vw, 28px);
      color: #ff0000;
      letter-spacing: 1px;
    }

    /* 朝左下的箭头，轻轻晃着指方向 */
    .ending-arrow {
      width: 1.15em;
      height: 1.15em;
      flex: none;
      color: #ff0000;
      animation: point-sw 1.1s ease-in-out infinite;
    }

    @keyframes point-sw {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-5px, 5px); }
    }

    /* 左下角那块招牌，摆在跳舞奶龙右边，不挡它 */
    .banner-link {
      position: fixed;
      left: calc(clamp(8px, 2.5vw, 32px) + clamp(64px, 9vw, 112px) + 14px);
      bottom: clamp(14px, 3vw, 38px);
      z-index: 3;
      font-family: "SimSun", "宋体", "STSong", serif;
      font-size: 13px;
      color: #0000ee;
      text-decoration: underline;
      white-space: nowrap;
    }

    .banner-link:visited { color: #551a8b; }
    .banner-link:hover { color: #ff0000; }

    /* 播放被拦时的提示，平时不出现 */
    .audio-tip {
      margin-top: 8px;
      max-width: 86vw;
      font-size: 12px;
      line-height: 1.5;
      color: #c62828;
      text-align: center;
    }

    @media (max-width: 420px) {
      .banner-link {
        left: clamp(8px, 2.5vw, 32px);
        bottom: calc(clamp(8px, 2.5vw, 32px) + 86px);
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <img class="corner-gif top-left" src="assets/image.gif" alt="" aria-hidden="true" />
  <img class="corner-gif top-right" src="assets/image.gif" alt="" aria-hidden="true" />
  <img class="corner-gif bottom-left" src="assets/image.gif" alt="" aria-hidden="true" />
  <img class="corner-gif bottom-right" src="assets/image.gif" alt="" aria-hidden="true" />

  <h1>🍋 奶龙大笑模拟器 🍋</h1>
  <p class="tip">点击奶龙，见证魔性大笑（再点一下可停止）</p>

  <img id="nailong" src="assets/nailong.png" alt="奶龙" />

  <button id="btn">开笑！</button>

  <p class="byline">本站“上海奶隆工程技术大学.club” is made by M1xqq</p>

  <p class="view-count">
    👀 本站已被围观 <b id="busuanzi_value_site_pv">…</b> 次
  </p>

  <p class="ending-tip">
    <svg class="ending-arrow" viewBox="0 0 60 60" fill="none" aria-hidden="true">
      <path d="M54 6 L18 42" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
      <path d="M18 42 L18 22" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
      <path d="M18 42 L38 42" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
    </svg>
    <span>点击左下角一口气看到大结局</span>
  </p>

  <a class="banner-link" href="https://www.sues.edu.cn/" target="_blank" rel="noopener">上海奶龙大学.com</a>

  <p id="audio-tip" class="audio-tip" hidden></p>

  <audio id="laugh" src="assets/laugh.mp3" preload="auto"></audio>

  <script>
    const dragon = document.getElementById("nailong");
    const btn = document.getElementById("btn");
    const laugh = document.getElementById("laugh");

    let laughing = false;

    // 预览面板是 iframe，浏览器对 iframe 里的播放限制更多，先把处境判断出来
    let inFrame = false;
    try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }

    const audioTip = document.getElementById("audio-tip");
    function showAudioTip(msg) {
      audioTip.textContent = msg;
      audioTip.hidden = false;
    }

    function startLaugh() {
      laughing = true;
      dragon.classList.add("laughing");
      btn.classList.add("playing");
      btn.textContent = "别笑了！";

      // 先让它响起来，再随机跳一段：某些环境（本地简易服务器）不支持 Range，
      // seek 会失败，但绝不能因此连声音都没了
      const p = laugh.play();
      if (p && typeof p.catch === "function") {
        p.catch((err) => {
          audioTip.hidden = true;
          showAudioTip(
            inFrame
              ? "播放被拦（" + err.name + "）：当前是在预览窗口里，浏览器对 iframe 的限制更严。请把地址复制到 Chrome/Edge 打开，或直接双击「奶龙大笑模拟器.html」。"
              : "播放被拦（" + err.name + "）：再点一下试试，或检查这个标签页是否被静音、系统音量是否开着。"
          );
        });
      }
      setTimeout(() => {
        try {
          const dur = laugh.duration;
          if (isFinite(dur) && dur > 6) laugh.currentTime = Math.random() * (dur - 6);
        } catch (e) {}
      }, 80);

      spawnHaha();
    }

    laugh.addEventListener("error", () => {
      const code = laugh.error ? laugh.error.code : "?";
      showAudioTip("音频加载失败（MediaError " + code + "），文件路径可能不对。");
    });

    function stopLaugh() {
      laughing = false;
      dragon.classList.remove("laughing");
      btn.classList.remove("playing");
      btn.textContent = "开笑！";
      laugh.pause();
    }

    function toggle() {
      laughing ? stopLaugh() : startLaugh();
    }

    // 大笑时往外飘“哈哈哈哈”
    function spawnHaha() {
      if (!laughing) return;
      const span = document.createElement("span");
      span.className = "haha";
      span.textContent = "哈哈哈哈哈";
      span.style.left = 20 + Math.random() * 60 + "vw";
      span.style.top = 35 + Math.random() * 25 + "vh";
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 1300);
      setTimeout(spawnHaha, 350 + Math.random() * 400);
    }

    dragon.addEventListener("click", toggle);
    btn.addEventListener("click", toggle);
    laugh.addEventListener("ended", () => { if (laughing) startLaugh(); });
  </script>

  <!-- 访问量统计：线上用不蒜子，本地预览自己数，免得看到全网 localhost 的天文数字 -->
  <script>
    (function () {
      const el = document.getElementById("busuanzi_value_site_pv");
      const host = location.hostname;
      const isLocal =
        location.protocol === "file:" ||
        host === "" ||
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "0.0.0.0" ||
        host === "[::1]";

      function localBump(suffix) {
        const key = "nailong_local_views";
        const n = (parseInt(localStorage.getItem(key), 10) || 0) + 1;
        localStorage.setItem(key, n);
        el.textContent = n + (suffix || "");
      }

      if (isLocal) {
        localBump("（本地预览）");
        return;
      }

      const s = document.createElement("script");
      s.async = true;
      s.src = "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
      document.body.appendChild(s);

      // 统计服务被墙 / 挂了，退回本地计数，不至于一直显示省略号
      setTimeout(() => {
        if (el && (el.textContent === "…" || el.textContent === "")) {
          localBump("（本机）");
        }
      }, 3000);
    })();
  </script>
</body>
</html>
