<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奶龙大笑模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fffdf5;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      user-select: none;
      overflow: hidden;
    }

    h1 {
      font-size: 28px;
      color: #f5a623;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .tip {
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* 四角装饰动图 */
    .corner-gif {
      position: fixed;
      width: clamp(64px, 9vw, 112px);
      height: auto;
      pointer-events: none;
      z-index: 1;
    }

    .corner-gif.top-left {
      top: clamp(8px, 2.5vw, 32px);
      left: clamp(8px, 2.5vw, 32px);
    }

    .corner-gif.top-right {
      top: clamp(8px, 2.5vw, 32px);
      right: clamp(8px, 2.5vw, 32px);
    }

    .corner-gif.bottom-left {
      bottom: clamp(8px, 2.5vw, 32px);
      left: clamp(8px, 2.5vw, 32px);
    }

    .corner-gif.bottom-right {
      right: clamp(8px, 2.5vw, 32px);
      bottom: clamp(8px, 2.5vw, 32px);
    }

    /* 奶龙本体：点击它就开笑 */
    #nailong {
      width: 260px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #nailong:hover { transform: scale(1.05); }
    #nailong:active { transform: scale(0.95); }

    /* 大笑状态：上下抖动 */
    #nailong.laughing {
      animation: shake-y 0.18s linear infinite;
    }

    @keyframes shake-y {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-22px); }
      100% { transform: translateY(0); }
    }

    #btn {
      margin-top: 28px;
      padding: 12px 42px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #f5a623;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d18a0f;
      transition: transform 0.1s;
    }

    #btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d18a0f;
    }

    #btn.playing {
      background: #ccc;
      box-shadow: 0 4px 0 #999;
    }

    /* 大笑时飘出来的“哈哈哈哈” */
    .haha {
      position: fixed;
      font-size: 22px;
      font-weight: bold;
      color: #f5a623;
      pointer-events: none;
      animation: float-up 1.2s ease-out forwards;
    }

    @keyframes float-up {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-140px) rotate(18deg); }
    }

    /* 底部访问量统计 */
    .view-count {
      margin-top: 14px;
      color: #c0a06a;
      font-size: 13px;
    }

    .view-count b {
      color: #f5a623;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <img class="corner-gif top-left" src="assets/image.gif" alt="" aria-hidden="true" />
  <img class="corner-gif top-right" src="assets/image.gif" alt="" aria-hidden="true" />
  <img class="corner-gif bottom-left" src="assets/image.gif" alt="" aria-hidden="true" />
  <img class="corner-gif bottom-right" src="assets/image.gif" alt="" aria-hidden="true" />

  <h1>🍋 奶龙大笑模拟器 🍋</h1>
  <p class="tip">点击奶龙，见证魔性大笑（再点一下可停止）</p>

  <img id="nailong" src="assets/nailong.png" alt="奶龙" />

  <button id="btn">开笑！</button>

  <p class="view-count">
    👀 本站已被围观 <b id="busuanzi_value_site_pv">…</b> 次
  </p>

  <audio id="laugh" src="assets/laugh.mp3" preload="auto"></audio>

  <script>
    const dragon = document.getElementById("nailong");
    const btn = document.getElementById("btn");
    const laugh = document.getElementById("laugh");

    let laughing = false;

    function startLaugh() {
      laughing = true;
      dragon.classList.add("laughing");
      btn.classList.add("playing");
      btn.textContent = "别笑了！";

      // 从随机位置开始播，每次听感不完全一样
      laugh.currentTime = Math.random() * 8;
      laugh.play().catch(() => {});

      spawnHaha();
    }

    function stopLaugh() {
      laughing = false;
      dragon.classList.remove("laughing");
      btn.classList.remove("playing");
      btn.textContent = "开笑！";
      laugh.pause();
    }

    function toggle() {
      laughing ? stopLaugh() : startLaugh();
    }

    // 大笑时往外飘“哈哈哈哈”
    function spawnHaha() {
      if (!laughing) return;
      const span = document.createElement("span");
      span.className = "haha";
      span.textContent = "哈哈哈哈哈";
      span.style.left = 20 + Math.random() * 60 + "vw";
      span.style.top = 35 + Math.random() * 25 + "vh";
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 1300);
      setTimeout(spawnHaha, 350 + Math.random() * 400);
    }

    dragon.addEventListener("click", toggle);
    btn.addEventListener("click", toggle);
    laugh.addEventListener("ended", () => { if (laughing) startLaugh(); });
  </script>

  <!-- 访问量统计（不蒜子，免费免注册） -->
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script>
    // 统计脚本加载失败时（被墙/挂了），退回本地计数，不至于显示空白
    setTimeout(() => {
      const el = document.getElementById("busuanzi_value_site_pv");
      if (el && (el.textContent === "…" || el.textContent === "")) {
        const key = "nailong_local_views";
        const n = (parseInt(localStorage.getItem(key), 10) || 0) + 1;
        localStorage.setItem(key, n);
        el.textContent = n + "（本机）";
      }
    }, 3000);
  </script>
</body>
</html>
